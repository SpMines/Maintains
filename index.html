<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --white:#ffffff; --ink:#1a1a1f; --muted:#6b6b76; --line:#e2e2e8; --band:#f6f6f9;
    --green:#2e7d32; --greenbg:#e6f4ea;
    --amber:#8a6d00; --amberbg:#fff4d6;
    --red:#b3261e;   --redbg:#fde8e6;
    --blue:#1a5fb4;  --bluebg:#e8f0fe;
    --grey:#5f6368;  --greybg:#eef0f2;
    --acc1:#6d3bff;  --acc2:#2d6cff;   /* purple -> blue accent */
    --accgrad:linear-gradient(90deg,#6d3bff,#2d6cff);
    --shadow:0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);
  }
  *{box-sizing:border-box;font-family:'Jost',sans-serif;margin:0;padding:0}
  html,body{-webkit-text-size-adjust:100%}
  body{background:var(--white);color:var(--ink);font-size:14px;line-height:1.5}
  .wrap{width:92vw;max-width:1400px;margin:0 auto;padding:16px 0 70px}
  header.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 0;border-bottom:2px solid var(--ink);margin-bottom:16px;flex-wrap:wrap}
  header.top h1{font-weight:800;font-size:20px;letter-spacing:.5px;background:var(--accgrad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  .search{flex:1;min-width:220px;max-width:460px;display:flex;gap:8px;align-items:center}
  .search input{flex:1;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font-size:14px}
  .synclbl{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--muted);white-space:nowrap}
  .syncDot{width:8px;height:8px;border-radius:50%;background:var(--grey);display:inline-block}
  .syncDot.on{background:var(--green);animation:pulseDot 2s infinite}
  @keyframes pulseDot{0%,100%{opacity:1}50%{opacity:.35}}
  nav.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:20px}
  nav.tabs button{padding:9px 15px;border:1px solid var(--line);background:var(--white);border-radius:22px;cursor:pointer;font-weight:500;font-size:13px;color:var(--muted);white-space:nowrap}
  nav.tabs button.active{background:var(--accgrad);color:#fff;border-color:transparent;box-shadow:0 2px 8px rgba(109,59,255,.25)}
  .btn{padding:9px 15px;border:1px solid var(--ink);background:var(--ink);color:#fff;border-radius:10px;cursor:pointer;font-weight:500;font-size:13px}
  .btn:not(.ghost){background:var(--accgrad);border-color:transparent}
  .btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
  .btn.sm{padding:6px 11px;font-size:12px}
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;margin-bottom:22px}
  .card{border:1px solid var(--line);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow);background:#fff}
  .card .k{font-size:12px;color:var(--muted);font-weight:500;letter-spacing:.2px}
  .card .v{font-size:26px;font-weight:700;margin-top:4px}
  .card.warn .v{color:var(--amber)} .card.bad .v{color:var(--red)} .card.ok .v{color:var(--green)} .card.info .v{color:var(--blue)}
  .section{margin-bottom:26px}
  .section h2{font-size:15px;font-weight:600;margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--line)}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
  td .btn,td .pill{vertical-align:middle}
  td:last-child{text-align:right;white-space:nowrap}
  th{background:var(--band);font-weight:600;color:var(--muted);font-size:11px;letter-spacing:.2px}
  tr:hover td{background:#fafafd}
  .pill{display:inline-block;padding:2px 9px;border-radius:12px;font-size:11px;font-weight:600}
  .pill.green{background:var(--greenbg);color:var(--green)} .pill.amber{background:var(--amberbg);color:var(--amber)}
  .pill.red{background:var(--redbg);color:var(--red)} .pill.grey{background:var(--greybg);color:var(--grey)} .pill.blue{background:var(--bluebg);color:var(--blue)}
  .link{color:var(--blue);cursor:pointer;text-decoration:none;font-weight:500}
  .link:hover{text-decoration:underline}
  .empty{color:var(--muted);padding:18px;text-align:center;font-style:italic}
  .row{display:flex;gap:14px;flex-wrap:wrap}
  .col{flex:1;min-width:260px}
  label.f{display:block;font-size:12px;color:var(--muted);font-weight:500;margin:10px 0 3px}
  input.f,select.f,textarea.f{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;font-size:13px}
  textarea.f{min-height:64px;resize:vertical}
  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto;z-index:50}
  .modal-bg.show{display:flex}
  .modal{background:#fff;border-radius:14px;width:100%;max-width:640px;padding:22px;box-shadow:0 10px 40px rgba(0,0,0,.2)}
  .modal h3{font-size:17px;font-weight:600;margin-bottom:4px}
  .modal .close{float:right;cursor:pointer;color:var(--muted);font-size:20px;line-height:1}
  .chkitem{border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px}
  .chkitem .q{font-weight:500;margin-bottom:8px}
  .chkitem.abn{border-color:var(--red);background:var(--redbg)}
  .kv{display:grid;grid-template-columns:180px 1fr;gap:6px 14px;font-size:13px}
  .kv .kk{color:var(--muted);font-weight:500}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:8px;font-size:13px;opacity:0;transition:.3s;z-index:99}
  .gload{position:fixed;inset:0;background:rgba(255,255,255,.45);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);z-index:200;display:none;align-items:center;justify-content:center}
  .gload.on{display:flex}
  .gload .glbox{display:flex;flex-direction:column;align-items:center;gap:10px;background:var(--ink);color:#fff;padding:18px 26px;border-radius:14px;box-shadow:0 8px 30px rgba(0,0,0,.25);font-size:13px;font-weight:500}
  .gload .sp{width:26px;height:26px;border:3px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .toast.show{opacity:1}
  .loader{text-align:center;padding:60px;color:var(--muted);font-weight:600;letter-spacing:2px;animation:pulse 1.2s infinite}
  @keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}
  .subtabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
  .subtabs button{padding:5px 11px;border:1px solid var(--line);background:#fff;border-radius:14px;cursor:pointer;font-size:12px;color:var(--muted)}
  .subtabs button.active{background:var(--band);color:var(--ink);font-weight:600}

  /* ===================== MOBILE / RESPONSIVE ===================== */
  @media (max-width: 760px){
    .wrap{width:94vw;padding:12px 0 90px}
    header.top{flex-direction:column;align-items:stretch;gap:10px;padding:10px 0}
    header.top h1{font-size:22px;text-align:center}
    .search{max-width:100%;min-width:0}
    /* tabs scroll horizontally instead of wrapping into many rows */
    nav.tabs{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:6px;margin-bottom:14px}
    nav.tabs::-webkit-scrollbar{height:0}
    nav.tabs button{flex:0 0 auto}
    /* stat cards: 2 per row on phone */
    .cards{grid-template-columns:repeat(2,1fr);gap:10px}
    .card .v{font-size:22px}
    /* tables scroll sideways inside their section (no page-wide overflow) */
    .section{overflow-x:auto;-webkit-overflow-scrolling:touch}
    table{min-width:600px}
    .section h2{font-size:14px}
    /* bigger touch targets */
    .btn{padding:11px 16px;font-size:14px}
    .btn.sm{padding:8px 12px;font-size:13px}
    nav.tabs button{padding:10px 16px;font-size:14px}
    /* modal fills the screen nicely */
    .modal-bg{padding:0;align-items:flex-end}
    .modal{max-width:100%;border-radius:16px 16px 0 0;max-height:92vh;overflow:auto}
    .row{flex-direction:column;gap:0}
    .col{min-width:0}
    .kv{grid-template-columns:130px 1fr}
  }
  @media (max-width: 400px){
    .cards{grid-template-columns:1fr}
    .kv{grid-template-columns:110px 1fr;font-size:12px}
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>Asset control center</h1>
    <div class="search">
      <input id="q" placeholder="Search asset / issue / bill / task / vendor..." onkeydown="if(event.key==='Enter')doSearch()">
      <button class="btn" onclick="doSearch()">Search</button>
      <span class="synclbl" title="Auto-syncs from the sheet"><span id="syncDot" class="syncDot on"></span>Live</span>
    </div>
  </header>

  <nav class="tabs" id="tabs">
    <button data-t="dashboard" class="active" onclick="go('dashboard')">Dashboard</button>
    <button data-t="today" onclick="go('today')">Today's work</button>
    <button data-t="done" onclick="go('done')">Recent done</button>
    <button data-t="assets" onclick="go('assets')">Assets</button>
    <button data-t="issues" onclick="go('issues')">Issues / breakdowns</button>
    <button data-t="bills" onclick="go('bills')">Bills</button>
    <button data-t="reports" onclick="go('reports')">Reports</button>
    <button data-t="manage" onclick="go('manage')">Manage</button>
  </nav>

  <div id="view"><div class="loader">Loading</div></div>
</div>

<!-- generic modal -->
<div class="modal-bg" id="modalBg"><div class="modal" id="modalBox"></div></div>
<div class="gload" id="gload"><div class="glbox"><span class="sp"></span>Loading...</div></div>
<div class="toast" id="toast"></div>

<script>
/* ------- tiny helpers ------- */
var LOOKUPS = null, CURRENT = 'dashboard';
var _silent = false;
var _viewToken = 0;   // bumped on every tab change; stale renders are ignored
function $(id){return document.getElementById(id);}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function toast(m){var t=$('toast');t.textContent=m;t.classList.add('show');setTimeout(function(){t.classList.remove('show');},2600);}
function openModal(html){$('modalBox').innerHTML=html;$('modalBg').classList.add('show');}
function closeModal(){$('modalBg').classList.remove('show');}
$('modalBg').addEventListener('click',function(e){if(e.target===this)closeModal();});
function money(n){n=Number(n)||0;return '\u20B9'+n.toLocaleString('en-IN');}

function statusPill(s){
  s=String(s||'').trim();var c='grey';
  if(/done|active|normal|paid/i.test(s))c='green';
  else if(/pending|expiring|maintenance|repair|progress|partial/i.test(s))c='amber';
  else if(/overdue|breakdown|expired|open|abnormal|unpaid|not ok/i.test(s))c='red';
  else if(/hold|recorded|inactive/i.test(s))c='grey';
  return '<span class="pill '+c+'">'+esc(s||'-')+'</span>';
}

/* run wrapper */
/* ========================================================================================
 * BACKEND CONNECTION
 * Two ways this HTML talks to the Apps Script backend:
 *   1. Served BY Apps Script (doGet)  -> google.script.run is available -> use it.
 *   2. Hosted STANDALONE (GitHub Pages, any host) -> set API_URL to your GAS web app /exec URL
 *      and it POSTs (CORS-safe text/plain) to the doPost router.
 * To go standalone: paste your deployment URL below, e.g.
 *   var API_URL = "https://script.google.com/macros/s/AKfy..../exec";
 * Leave it "" when the file is served by Apps Script.
 * ====================================================================================== */
var API_URL = "https://script.google.com/macros/s/AKfycbzLHMFfNt62hyxgAhE4RdITuAnUc7PaZQXdWsNPRcp4A_WPxHadXVbzEC0D8RcC3U5bfg/exec";   // <-- paste your GAS web app /exec URL here to run this HTML anywhere

function hasGSR(){ try { return (typeof google!=='undefined') && google.script && google.script.run; } catch(e){ return false; } }

var _busy=0;
var _loadTimer=null;
function loadOn(){_busy++;if(!_loadTimer){_loadTimer=setTimeout(function(){var g=$('gload');if(g&&_busy>0)g.classList.add('on');},220);}}
function loadOff(){_busy=Math.max(0,_busy-1);if(_busy===0){if(_loadTimer){clearTimeout(_loadTimer);_loadTimer=null;}var g=$('gload');if(g)g.classList.remove('on');}}

function run(fn,args,cb){
  args=args||[];
  var quiet=_silent;
  if(!quiet)loadOn();
  var done=function(r){if(!quiet)loadOff();cb(r);};
  var onErr=function(msg){if(!quiet)loadOff();if(!quiet){$('view').innerHTML='<div class="empty">Error: '+esc(msg)+'</div>';toast('Error: '+msg);}};

  // Mode 1: served by Apps Script
  if(hasGSR() && !API_URL){
    google.script.run.withSuccessHandler(done).withFailureHandler(function(e){onErr(e.message);})[fn].apply(google.script.run,args);
    return;
  }
  // Mode 2: standalone -> fetch POST (CORS-safe text/plain) to the doPost router
  if(!API_URL){ onErr('API_URL not set. Paste your GAS /exec URL at the top of the file, or open the app from the Apps Script web app.'); return; }
  fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:fn,args:args})})
    .then(function(r){return r.json();})
    .then(function(d){ if(d && d.ok){ done(d.result); } else { onErr((d&&d.error)||'Unknown error'); } })
    .catch(function(e){ onErr(e.message); });
}

function go(tab){
  CURRENT=tab;
  _viewToken++;                 // invalidate any in-flight loads from the previous tab
  var myTok=_viewToken;
  Array.prototype.forEach.call(document.querySelectorAll('#tabs button'),function(b){b.classList.toggle('active',b.dataset.t===tab);});
  $('view').innerHTML='<div class="loader">Loading</div>';
  if(tab==='dashboard')loadDashboard(myTok);
  else if(tab==='today')loadToday(myTok);
  else if(tab==='done')loadDone(myTok);
  else if(tab==='assets')loadAssets(myTok);
  else if(tab==='issues')loadIssues(myTok);
  else if(tab==='bills')loadBills(myTok);
  else if(tab==='reports')loadReports(myTok);
  else if(tab==='manage')loadManage(myTok);
}
/* true if this render still belongs to the current view (else a newer tab was opened) */
function fresh(tok){ return tok===undefined || tok===_viewToken; }
function setView(html,tok){ if(tok!==undefined && tok!==_viewToken) return; $('view').innerHTML=html; }


/* ---------------- DASHBOARD ---------------- */
function loadDashboard(tok){
  run('api_dashboard',[],function(d){
    var cards=[
      ['Total Assets',d.totalAssets,''],['Active',d.activeAssets,'ok'],
      ['Tasks Today',d.tasksToday,'info'],['Pending',d.pending,'warn'],['Overdue',d.overdue,'bad'],
      ['Open issues',d.openIssues,'warn'],['Open Breakdowns',d.openBreakdowns,'bad'],
      ['Under Maintenance',d.underMaintenance,'warn'],
      ['Warranty Expiring',d.warrantyExpiring,'warn'],['Warranty Expired',d.warrantyExpired,'bad'],
      ['Pending bills',d.pendingBills,'warn'],['Unpaid Amount',money(d.unpaidAmount),'bad'],
      ['This Month Expense',money(d.monthExpense),'info']
    ];
    var h='<div class="cards">'+cards.map(function(c){
      return '<div class="card '+(c[2]||'')+'"><div class="k">'+c[0]+'</div><div class="v">'+esc(c[1])+'</div></div>';
    }).join('')+'</div>';

    // Bill Generate Pending (escalated / breakdown issues awaiting a bill+proof)
    if(d.billPending&&d.billPending.length){
      h+='<div class="section"><h2>Bill generate pending &mdash; breakdowns ('+d.billPending.length+')</h2>'+
        '<table><tr><th>Issue</th><th>Asset</th><th>Problem</th><th>Severity</th><th></th></tr>';
      d.billPending.forEach(function(r){
        h+='<tr><td>'+esc(r['Issue ID'])+'</td>'+
          '<td><a class="link" onclick="assetDetail(\''+esc(r['Asset ID'])+'\')">'+esc(r['Asset ID'])+'</a></td>'+
          '<td>'+esc(r['Problem'])+'</td><td>'+esc(r['Severity'])+'</td>'+
          '<td><button class="btn sm" onclick=\'openBill("'+esc(r['Asset ID'])+'","'+esc(r['Issue ID'])+'")\'>Generate bill + proof</button></td></tr>';
      });
      h+='</table></div>';
    }

    // Recent issues - actionable (escalate / generate bill) right here
    h+='<div class="section"><h2>Recent issues</h2>';
    if(!d.recentIssues||!d.recentIssues.length){h+='<div class="empty">No open issues.</div>';}
    else{
      h+='<table><tr><th>ID</th><th>Asset</th><th>Type</th><th>Problem</th><th>Severity</th><th>Status</th><th></th></tr>';
      d.recentIssues.forEach(function(r){
        h+='<tr><td>'+esc(r['Issue ID'])+'</td>'+
          '<td><a class="link" onclick="assetDetail(\''+esc(r['Asset ID'])+'\')">'+esc(r['Asset ID'])+'</a></td>'+
          '<td>'+esc(r['Issue Type'])+'</td><td>'+esc(r['Problem'])+'</td><td>'+esc(r['Severity'])+'</td>'+
          '<td>'+statusPill(r['Status'])+(String(r['Needs Bill']).toLowerCase()==='yes'?' <span class="pill amber">bill pending</span>':'')+'</td>'+
          '<td style="white-space:nowrap"><button class="btn sm" onclick=\'openEscalate('+JSON.stringify(r)+')\'>Escalate</button> '+
          (String(r['Needs Bill']).toLowerCase()==='yes'?'<button class="btn sm ghost" onclick=\'openBill("'+esc(r['Asset ID'])+'","'+esc(r['Issue ID'])+'")\'>Bill</button>':'')+'</td></tr>';
      });
      h+='</table>';
    }
    h+='</div>';

    if(d.repeatBreakdowns&&d.repeatBreakdowns.length){
      h+='<div class="section"><h2>Repeated breakdowns</h2><table><tr><th>Asset</th><th>Breakdowns</th></tr>'+
        d.repeatBreakdowns.map(function(r){return '<tr><td><a class="link" onclick="assetDetail(\''+r.assetId+'\')">'+esc(r.assetId)+'</a></td><td>'+r.breakdowns+'</td></tr>';}).join('')+'</table></div>';
    }
    if(d.expenseTrend&&d.expenseTrend.length){
      h+='<div class="section"><h2>Expense trend (6 mo)</h2><table><tr>'+
        d.expenseTrend.map(function(t){return '<th>'+esc(t.month)+'</th>';}).join('')+'</tr><tr>'+
        d.expenseTrend.map(function(t){return '<td>'+money(t.total)+'</td>';}).join('')+'</tr></table></div>';
    }
    setView(h,tok);
  });
}

/* ---------------- TODAY'S WORK ---------------- */
var TODAY_ROWS=[], TODAY_LOC='__all';
function loadToday(tok){
  run('api_todaysWork',[],function(rows){
    TODAY_ROWS=rows||[];
    renderToday(tok);   // always render so header + Assign button show even when empty
  });
}
function renderToday(tok){
  // unique locations from the rows
  var locs={}; TODAY_ROWS.forEach(function(r){ var l=(r.location||'').trim()||'(no location)'; locs[l]=true; });
  var locList=Object.keys(locs).sort();
  var shown=TODAY_ROWS.filter(function(r){
    if(TODAY_LOC==='__all')return true;
    var l=(r.location||'').trim()||'(no location)';
    return l===TODAY_LOC;
  });
  var opts='<option value="__all">All locations ('+TODAY_ROWS.length+')</option>'+
    locList.map(function(l){
      var n=TODAY_ROWS.filter(function(r){return ((r.location||'').trim()||'(no location)')===l;}).length;
      return '<option value="'+esc(l)+'"'+(l===TODAY_LOC?' selected':'')+'>'+esc(l)+' ('+n+')</option>';
    }).join('');
  var h='<div class="section">'+
    '<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px">'+
      '<h2 style="border:0">Today &amp; overdue ('+shown.length+')</h2>'+
      '<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">'+
      '<button class="btn sm" onclick="openAssign()">+ Assign task</button>'+
      '<label class="f" style="margin:0;display:flex;align-items:center;gap:6px">Location: '+
      '<select class="f" style="max-width:240px;margin:0" onchange="TODAY_LOC=this.value;renderToday()">'+opts+'</select></label>'+
      '</div>'+
    '</div>';
  if(!shown.length){ h+='<div class="empty">No pending or overdue tasks here. Use "+ Assign task" to add work.</div></div>'; setView(h,tok); return; }
  h+='<div style="margin-bottom:8px"><button class="btn sm ghost" onclick="deleteSelectedTasks()">Delete selected</button></div>';
  h+='<table><tr><th><input type="checkbox" onclick="toggleAllToday(this)"></th><th>Asset</th><th>Type</th><th>Location</th><th>Task</th><th>Freq</th><th>Planned</th><th>Doer</th><th>Status</th><th></th></tr>';
  shown.forEach(function(r){
    h+='<tr>'+
      '<td><input type="checkbox" class="tchk" data-t="'+esc(r.taskId)+'" data-a="'+esc(r.assetId)+'"></td>'+
      '<td><a class="link" onclick="assetDetail(\''+esc(r.assetId)+'\')">'+esc(r.assetId||'-')+'</a></td>'+
      '<td>'+esc(r.assetType)+'</td><td>'+esc(r.location)+'</td><td>'+esc(r.task)+'</td>'+
      '<td>'+esc(r.frequency)+'</td><td>'+esc(r.plannedDate)+(r.overdue?' <span class="pill red">OVERDUE</span>':'')+'</td>'+
      '<td>'+esc(r.doer)+'</td><td>'+statusPill(r.status)+'</td>'+
      '<td style="white-space:nowrap"><button class="btn sm" onclick=\'startChecklist('+JSON.stringify(r)+')\'>Start</button> '+
      '<button class="btn sm ghost" onclick="removeTask(\''+esc(r.taskId)+'\',\''+esc(r.assetId)+'\',\''+esc(r.plannedDate)+'\')">Remove</button></td></tr>';
  });
  h+='</table></div>';
  setView(h,tok);
}
function toggleAllToday(cb){ Array.prototype.forEach.call(document.querySelectorAll('#view .tchk'),function(c){c.checked=cb.checked;}); }
function deleteSelectedTasks(){
  var list=[];

/* ---------------- RECENT DONE ---------------- */
function loadDone(tok){
  run('api_recentDone',[100],function(res){
    var clean=(res&&res.clean)||[], wi=(res&&res.withIssue)||[];
    if(!clean.length&&!wi.length){setView('<div class="empty">No completed tasks yet.</div>',tok);return;}
    var h='';
    // With issue / breakdown first (needs attention)
    h+='<div class="section"><h2>Done with issue / breakdown ('+wi.length+')</h2>';
    if(!wi.length){h+='<div class="empty">None.</div>';}
    else{
      h+='<table><tr><th>Done on</th><th>Asset</th><th>Type</th><th>Task</th><th>Issue</th><th>Doer</th></tr>';
      wi.forEach(function(r){
        h+='<tr><td><span class="pill amber">'+esc(r.actualDate||'-')+'</span></td>'+
          '<td><a class="link" onclick="assetDetail(\''+esc(r.assetId)+'\')">'+esc(r.assetId)+'</a></td>'+
          '<td>'+esc(r.assetType)+'</td><td>'+esc(r.task)+'</td>'+
          '<td><span class="pill red">'+esc(r.issueSummary||'issue')+'</span></td><td>'+esc(r.doer)+'</td></tr>';
      });
      h+='</table>';
    }
    h+='</div>';
    // Clean done
    h+='<div class="section"><h2>Recent done &mdash; no issue ('+clean.length+')</h2>';
    if(!clean.length){h+='<div class="empty">None.</div>';}
    else{
      h+='<table><tr><th>Done on</th><th>Asset</th><th>Type</th><th>Task</th><th>Freq</th><th>Doer</th></tr>';
      clean.forEach(function(r){
        h+='<tr><td><span class="pill green">'+esc(r.actualDate||'-')+'</span></td>'+
          '<td><a class="link" onclick="assetDetail(\''+esc(r.assetId)+'\')">'+esc(r.assetId)+'</a></td>'+
          '<td>'+esc(r.assetType)+'</td><td>'+esc(r.task)+'</td><td>'+esc(r.frequency)+'</td><td>'+esc(r.doer)+'</td></tr>';
      });
      h+='</table>';
    }
    h+='</div>';
    setView(h,tok);
  });
}

/* ---------------- ASSIGN TASK (location-wise, all or partial machines) ---------------- */
var ASSIGN_ASSETS=[];
function openAssign(){
  run('api_assetList',[],function(all){
    ASSIGN_ASSETS=(all||[]).filter(function(a){return String(a.status).toLowerCase()!=='inactive';});
    var locs={}; ASSIGN_ASSETS.forEach(function(a){var l=(a.location||'').trim()||'(no location)';locs[l]=true;});
    var locList=Object.keys(locs).sort();
    var locOpts='<option value="__all">All locations</option>'+locList.map(function(l){
      var n=ASSIGN_ASSETS.filter(function(a){return ((a.location||'').trim()||'(no location)')===l;}).length;
      return '<option value="'+esc(l)+'">'+esc(l)+' ('+n+')</option>';
    }).join('');
    var doers=[''].concat(LOOKUPS.doers||[]).map(function(dd){return '<option>'+esc(dd)+'</option>';}).join('');
    var tnames=(LOOKUPS.taskNames||[]);
    var taskOpts=tnames.length
      ? tnames.map(function(t){return '<option>'+esc(t)+'</option>';}).join('')
      : '<option value="">(no tasks defined - add in Manage &rarr; Tasks)</option>';
    var today=new Date().toISOString().slice(0,10);
    openModal('<span class="close" onclick="closeModal()">&times;</span><h3>Assign task</h3>'+
      '<div class="row"><div class="col"><label class="f">Location</label>'+
      '<select class="f" id="asLoc" onchange="renderAssignMachines()">'+locOpts+'</select></div>'+
      '<div class="col"><label class="f">Date</label><input class="f" id="asDate" type="date" value="'+today+'"></div></div>'+
      '<div class="row"><div class="col"><label class="f">Task</label><select class="f" id="asTask">'+taskOpts+'</select></div>'+
      '<div class="col"><label class="f">Assign to (doer)</label><select class="f" id="asDoer">'+doers+'</select></div></div>'+
      '<label class="f" style="display:flex;justify-content:space-between;align-items:center">Machines '+
      '<span><button class="btn sm ghost" onclick="assignAllToggle(true)">All</button> '+
      '<button class="btn sm ghost" onclick="assignAllToggle(false)">None</button></span></label>'+
      '<div id="asMachines" style="max-height:230px;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:8px"></div>'+
      '<div style="margin-top:14px"><button class="btn" id="asBtn" onclick="doAssign()">Assign</button></div>');
    renderAssignMachines();

function assignFiltered(){
  var loc=$('asLoc').value;
  return ASSIGN_ASSETS.filter(function(a){
    if(loc==='__all')return true;
    return ((a.location||'').trim()||'(no location)')===loc;
  });
}
function renderAssignMachines(){
  var list=assignFiltered();
  if(!list.length){$('asMachines').innerHTML='<div class="empty" style="padding:8px">No machines here.</div>';return;}
  $('asMachines').innerHTML=list.map(function(a){
    return '<label style="display:flex;align-items:center;gap:8px;padding:4px 2px;font-size:13px">'+
      '<input type="checkbox" class="asChk" value="'+esc(a.assetId)+'" checked> '+
      '<b>'+esc(a.assetId)+'</b> &middot; '+esc(a.name||'')+' <span style="color:var(--muted)">('+esc(a.type||'')+')</span></label>';
  }).join('');
}
function assignAllToggle(on){
  Array.prototype.forEach.call(document.querySelectorAll('#asMachines .asChk'),function(c){c.checked=on;});
}
function doAssign(){
  var ids=[];
  Array.prototype.forEach.call(document.querySelectorAll('#asMachines .asChk'),function(c){if(c.checked)ids.push(c.value);});
  if(!ids.length){toast('Select at least one machine');return;}
  var tn=($('asTask').value||'').trim();
  if(!tn){toast('No task selected. Add tasks in Manage -> Tasks first.');return;}
  var o={taskName:tn,doer:$('asDoer').value,date:$('asDate').value,
    location:($('asLoc').value==='__all'?'':$('asLoc').value),assetIds:ids};
  $('asBtn').disabled=true;$('asBtn').textContent='Assigning...';
  run('api_assignTasks',[o],function(res){
    closeModal();
    toast('Assigned to '+res.added+' machine(s)');
    if(CURRENT==='today')loadToday(); else go('today');
  });
}

/* ---------------- CHECKLIST EXECUTION ---------------- */
function startChecklist(task){
  // One round-trip: asset detail + checklist together (faster).
  run('api_startTask',[task.assetId,task.assetType,task.frequency],function(res){
    renderChecklistModal(task,(res&&res.detail)||null,(res&&res.checklist)||[]);
  });
}

function renderChecklistModal(task,d,items){
  var o=(d&&d.overview)||{}, rel=(d&&d.reliability)||{};
  var panel='<div class="section" style="margin-bottom:14px"><div class="kv">'+
    kv('Machine',(o['Asset Name']||task.assetId)+' ('+esc(o['Asset Type']||task.assetType||'')+')')+
    kv('Location',o['Current Location']||o['Location']||task.location||'-')+
    kv('Status',o['Current Status']||'-')+
    kv('Warranty',(o['Warranty Status']||'-')+(o['Warranty End']?(' till '+o['Warranty End']):''))+
    kv('Guarantee',(o['Guarantee Status']||'-')+(o['Guarantee End']?(' till '+o['Guarantee End']):''))+
    kv('Breakdowns',(rel.breakdownCount||0)+(rel.lastBreakdownDate?(' (last '+rel.lastBreakdownDate+')'):''))+
    kv('Open issues',(d&&d.issues?d.issues.filter(function(x){return String(x['Status']).toLowerCase()!=='closed';}).length:0))+
    kv('Total spend',money((d&&d.totalCost)||0))+
    '</div></div>';

  // problem block html (re-used)
  function probBlock(){
    return '<div class="probBlock" style="display:none;margin-top:8px;padding:10px;border:1px solid var(--red);border-radius:8px;background:var(--redbg)">'+
      '<label class="f" style="margin-top:0;color:var(--red)">What is wrong? / What is happening?</label>'+
      '<textarea class="f prob" placeholder="Describe the problem"></textarea>'+
      '<label class="f">Photo (proof)</label><input class="f photo" type="file" accept="image/*">'+
      '<label class="f" style="display:flex;align-items:center;gap:6px;margin-top:8px"><input type="checkbox" class="esc"> Escalate this issue? (Breakdown + bill pending)</label>'+
      '</div>';
  }

  var h='<span class="close" onclick="closeModal()">&times;</span>'+
    '<h3>'+esc(task.task)+'</h3>'+panel+
    '<p style="color:var(--muted);margin-bottom:8px">Check the machine. If something is wrong, a form opens at that point (what is wrong + photo + escalate).</p>'+
    '<div id="chkList">';

  // ---- ALWAYS: overall Machine OK? gate (works even when no checklist items exist) ----
  h+='<div class="chkitem overall" data-item="OVERALL" data-rt="Yes / No" data-mn="" data-mx="" data-q="Overall — is the machine OK?">'+
     '<div class="q"><b>Overall — is the machine OK?</b></div>'+
     '<select class="f resp"><option value="">-- select --</option><option>Yes</option><option>No</option></select>'+
     probBlock()+
     '<input class="f rem" style="margin-top:6px" placeholder="Remark (optional)">'+
     '</div>';

  // ---- per-item checklist questions (if any for this asset type) ----
  items.forEach(function(it,i){
    h+='<div class="chkitem" data-item="'+esc(it['Item ID'])+'" data-rt="'+esc(it['Response Type'])+'" data-mn="'+esc(it['Minimum Value'])+'" data-mx="'+esc(it['Maximum Value'])+'" data-q="'+esc(it['Question'])+'">'+
       '<div class="q">'+(i+1)+'. '+esc(it['Question'])+(it['Unit']?(' ('+esc(it['Unit'])+')'):'')+'</div>'+
       responseInput(it,i)+ probBlock()+
       '<input class="f rem" style="margin-top:6px" placeholder="Remark (optional)">'+
       '</div>';
  });
  h+='</div>'+
     '<div style="margin-top:14px;display:flex;gap:8px"><button class="btn" onclick=\'finishChecklist('+JSON.stringify(task)+')\'>Save &amp; complete (mark done)</button>'+
     '<button class="btn ghost" onclick="closeModal()">Cancel</button></div>';
  openModal(h);
  Array.prototype.forEach.call(document.querySelectorAll('#chkList .resp'),function(el){
    el.addEventListener('change',function(){abnCheck(el.closest('.chkitem'));});
    el.addEventListener('keyup',function(){abnCheck(el.closest('.chkitem'));});
  });
}

function responseInput(it){
  var rt=String(it['Response Type']||'').trim();
  if(rt==='Numeric Reading') return '<input class="f resp" type="number" step="any" placeholder="reading">';
  if(rt==='OK / NOT OK') return sel(['OK','NOT OK']);
  if(rt==='Yes / No') return sel(['Yes','No']);
  if(rt==='Done / Not Done') return sel(['Done','Not Done']);
  if(rt==='Date') return '<input class="f resp" type="date">';
  if(rt==='Time') return '<input class="f resp" type="time">';
  return '<input class="f resp" placeholder="answer">';
  function sel(opts){return '<select class="f resp"><option value="">-- select --</option>'+opts.map(function(o){return '<option>'+o+'</option>';}).join('')+'</select>';}
}

/* decide if an answer is a problem and show/hide its problem block */
function abnCheck(el){
  if(!el)return;
  var rt=el.dataset.rt, resp=el.querySelector('.resp'), val=resp?String(resp.value):'';
  var bad=false;
  if(rt==='OK / NOT OK') bad=(val==='NOT OK');
  else if(rt==='Yes / No') bad=(val==='No');
  else if(rt==='Done / Not Done') bad=(val==='Not Done');
  else if(rt==='Numeric Reading'){
    var v=parseFloat(val); if(!isNaN(v)){var mn=parseFloat(el.dataset.mn),mx=parseFloat(el.dataset.mx);
      if(!isNaN(mn)&&v<mn)bad=true; if(!isNaN(mx)&&v>mx)bad=true;}
  }
  var pb=el.querySelector('.probBlock');
  if(pb){pb.style.display=bad?'block':'none'; el.classList.toggle('abn',bad);}
}

function finishChecklist(task,forceEmpty){
  var items=forceEmpty?[]:Array.prototype.slice.call(document.querySelectorAll('#chkList .chkitem'));
  var answers=[], photoJobs=[];
  items.forEach(function(el){
    var resp=el.querySelector('.resp'); var rem=el.querySelector('.rem');
    var rt=el.dataset.rt; var val=resp?resp.value:'';
    var pb=el.querySelector('.probBlock'); var isBad=pb&&pb.style.display!=='none';
    var isOverall=el.classList.contains('overall');
    if(val===''&&(!rem||rem.value==='')&&!isBad) return; // skip fully blank
    var a={itemId:el.dataset.item,question:el.dataset.q||'',remarks:rem?rem.value:''};
    if(rt==='Numeric Reading'){a.numeric=val;} else {a.response=val;}
    if(isOverall) a.overall=true;
    if(isBad){
      a.problem=el.querySelector('.prob')?el.querySelector('.prob').value:'';
      a.escalate=el.querySelector('.esc')?el.querySelector('.esc').checked:false;
      a.raiseIssue=true;
      var pf=el.querySelector('.photo');
      if(pf&&pf.files&&pf.files[0]){
        (function(ans,file){ photoJobs.push(new Promise(function(res){
          var r=new FileReader();
          r.onload=function(){ans.photoBase64=r.result.split(',')[1];ans.photoMime=file.type;ans.photoName=file.name;res();};
          r.onerror=function(){res();}; r.readAsDataURL(file);
        })); })(a,pf.files[0]);
      }
    }
    answers.push(a);
  });

  toast('Saving...');
  Promise.all(photoJobs).then(function(){
    var payload={assetId:task.assetId,taskId:task.taskId,plannedDate:task.plannedDate,doer:task.doer,
      answers:answers,markDone:true};
    run('api_saveChecklist',[payload],function(res){
      closeModal();
      var msg='Task done.';
      if(res.issues&&res.issues.length)msg+=' '+res.issues.length+' issue raised.';
      if(res.escalated&&res.escalated.length)msg+=' Escalated (breakdown).';
      toast(msg);
      // If an escalation auto-created a draft bill, ask for its photo now.
      if(res.draftBills&&res.draftBills.length){ setTimeout(function(){openBillProof(res.draftBills[0]);},400); return; }
      if(CURRENT==='today')loadToday(); else if(CURRENT==='dashboard')loadDashboard();
    });
  });
}

function assetDetail(id){

      kv('Status',o['Current Status'])+kv('Criticality',o['Criticality'])+kv('Vendor',o['Vendor'])+
      '</div></div><div class="col"><div class="kv">'+
      kv('Warranty',(o['Warranty Status']||'')+(o['Warranty End']?(' (till '+o['Warranty End']+')'):''))+
      kv('Guarantee',(o['Guarantee Status']||'')+(o['Guarantee End']?(' (till '+o['Guarantee End']+')'):''))+
      kv('Installed',rel.installDate)+kv('Days since install',rel.daysSinceInstall)+

function kv(k,v){return '<div class="kk">'+esc(k)+'</div><div>'+esc(v||'-')+'</div>';}
function histSection(title,rows,cols){
  var h='<div class="section"><h2>'+esc(title)+' ('+(rows?rows.length:0)+')</h2>';
  if(!rows||!rows.length){return h+'<div class="empty">None.</div></div>';}
  h+='<table><tr>'+cols.map(function(c){return '<th>'+esc(c)+'</th>';}).join('')+'</tr>';
  rows.forEach(function(r){
    h+='<tr>'+cols.map(function(c){
      var v=r[c]||'';
      if(c==='Result'||c==='Status'||c==='Payment Status')return '<td>'+statusPill(v)+'</td>';
      if(c==='Drive File URL'&&v)return '<td><a class="link" href="'+esc(v)+'" target="_blank">view</a></td>';
      if((c==='Cost'||c==='Total Amount')&&v!=='')return '<td>'+money(v)+'</td>';
      return '<td>'+esc(v)+'</td>';
    }).join('')+'</tr>';
  });
  return h+'</table></div>';
}

function saveBill(){
  var issueId=$('bIssue')?$('bIssue').value:'';
  var o={assetId:$('ba').value,issueId:issueId,vendor:$('bv').value,invoiceNumber:$('bin').value,invoiceDate:$('bid').value,
    billType:$('bt').value,subtotal:$('bs').value,gst:$('bg').value,paymentStatus:$('bps').value};
  var fileInput=$('bf');
  var hasFile=fileInput&&fileInput.files&&fileInput.files[0];
  if(issueId&&!hasFile){toast('Proof file required for issue bills');return;}
  var send=function(){
    $('bbtn').disabled=true;$('bbtn').textContent='Saving...';
    run('api_createBill',[o],function(res){closeModal();toast('Bill '+res.billId+' saved');
      if(CURRENT==='bills')loadBills(); else if(CURRENT==='dashboard')loadDashboard(); else if(o.assetId)assetDetail(o.assetId);});

  if(hasFile){
    var f=fileInput.files[0],reader=new FileReader();
    reader.onload=function(){o.file={base64:reader.result.split(',')[1],mimeType:f.type,filename:f.name};send();};
    reader.readAsDataURL(f);
  } else { send(); }
}

function doSearch(){
  var q=$('q').value.trim();if(!q)return;
  CURRENT='search';$('view').innerHTML='<div class="loader">Searching</div>';
  Array.prototype.forEach.call(document.querySelectorAll('#tabs button'),function(b){b.classList.remove('active');});
  run('api_search',[q],function(r){
    var h='';
    h+=searchBlock('Assets',r.assets,function(a){return '<a class="link" onclick="assetDetail(\''+esc(a['Asset ID'])+'\')">'+esc(a['Asset ID'])+'</a> &middot; '+esc(a['Asset Name']||a['Asset Name / Type']||'')+' ('+esc(a['Asset Type']||'')+')';});
    h+=searchBlock('Issues',r.issues,function(a){return esc(a['Issue ID'])+' &middot; '+esc(a['Asset ID'])+' &middot; '+esc(a['Problem']);});
    h+=searchBlock('Bills',r.bills,function(a){return esc(a['Bill ID'])+' &middot; '+esc(a['Vendor'])+' &middot; '+money(a['Total Amount']);});
    h+=searchBlock('Tasks',r.tasks,function(a){return esc(a['Task ID'])+' &middot; '+esc(a['Task']);});

    '<label class="f">Import into</label><select class="f" id="impTarget" onchange="importTargetChange()" style="max-width:260px">'+opts+'</select>'+
    '<p class="small" style="margin-top:8px">Columns (header row required):<br><code>'+esc(def.cols)+'</code></p>'+
    '<div style="margin:8px 0"><button class="btn sm ghost" onclick="fillSampleCSV()">Insert sample</button> '+
    '<input type="file" id="csvFile" accept=".csv,text/csv" style="display:inline-block;margin-left:8px" onchange="readCSVFile()"></div>'+
    '<textarea class="f" id="csvText" style="min-height:150px;font-family:monospace" placeholder="paste CSV here"></textarea>'+
    '<div style="margin-top:10px"><button class="btn" onclick="parseImport()">Preview</button></div>'+
    '<div id="impPreview"></div></div>';
  $('mgBody').innerHTML=h;
}
function importTargetChange(){ IMPORT_TARGET=$('impTarget').value; manageImport(); }
function fillSampleCSV(){ $('csvText').value=IMPORT_DEF[IMPORT_TARGET].sample; }
function readCSVFile(){
  var f=$('csvFile').files[0];if(!f)return;
  var r=new FileReader();r.onload=function(){$('csvText').value=r.result;parseImport();};r.readAsText(f);
}
function parseCSV_(text){
  var lines=String(text||'').trim().split(/\r?\n/).filter(function(l){return l.trim();});
  if(lines.length<2)return {header:[],rows:[]};
  function splitLine(l){
    var out=[],cur='',q=false;
    for(var i=0;i<l.length;i++){var c=l[i];
      if(c==='"'){q=!q;}
      else if(c===','&&!q){out.push(cur);cur='';}
      else cur+=c;}
    out.push(cur);return out.map(function(s){return s.trim();});
  }
  var header=splitLine(lines[0]).map(function(h){return h.toLowerCase().replace(/[^a-z0-9]/g,'');});
  var rows=[];
  for(var i=1;i<lines.length;i++){
    var cells=splitLine(lines[i]);var o={};
    header.forEach(function(h,idx){o[h]=cells[idx]||'';});
    rows.push(o);
  }
  return {header:header,rows:rows};
}
function parseImport(){
  var p=parseCSV_($('csvText').value);
  if(!p.rows.length){$('impPreview').innerHTML='<div class="empty">Nothing to parse. Check the header row.</div>';return;}
  IMPORT_ROWS=p.rows;
  var prev=IMPORT_DEF[IMPORT_TARGET].prev;
  var h='<div class="section"><h2>Preview ('+IMPORT_ROWS.length+' rows into '+esc(IMPORT_DEF[IMPORT_TARGET].label)+')</h2>'+
    '<table><tr>'+prev.map(function(c){return '<th>'+esc(c)+'</th>';}).join('')+'</tr>';
  IMPORT_ROWS.slice(0,50).forEach(function(r){ h+='<tr>'+prev.map(function(c){return '<td>'+esc(r[c]||'-')+'</td>';}).join('')+'</tr>'; });
  h+='</table><div style="margin-top:12px"><button class="btn" id="impBtn" onclick="commitImport()">Import '+IMPORT_ROWS.length+' rows</button></div></div>';
  $('impPreview').innerHTML=h;
}
function commitImport(){
  if(!IMPORT_ROWS.length)return;
  $('impBtn').disabled=true;$('impBtn').textContent='Importing...';
  run('api_bulkImport',[IMPORT_TARGET,IMPORT_ROWS],function(res){
    var m='Imported '+res.added+' into '+IMPORT_TARGET;
    if(res.errors&&res.errors.length)m+=' ('+res.errors.length+' skipped)';
    toast(m);
    IMPORT_ROWS=[]; loadManage();
  });
}

/* --- Manage: RESET / WIPE --- */
function manageReset(){
  $('mgBody').innerHTML='<div class="section"><h2>Reset / wipe data</h2>'+
    '<div class="warn" style="border-left:4px solid var(--red);background:var(--redbg);padding:10px 12px;border-radius:0 6px 6px 0;margin-bottom:12px">'+
    '<b>Danger.</b> This permanently deletes data rows (headers stay). Cannot be undone. Type <b>DELETE</b> to confirm.</div>'+
    '<label class="f">What to wipe</label><select class="f" id="wipeScope" style="max-width:320px">'+
    '<option value="transactions">Transactions (issues, bills, money, maintenance, movement, checklist answers)</option>'+
    '<option value="lifecycle">Lifecycle (+ asset registry, checklist questions)</option>'+
    '<option value="scheduler">Scheduler (Master + For PC only)</option>'+
    '<option value="everything">EVERYTHING (all data sheets)</option>'+
    '</select>'+
    '<label class="f">Type DELETE to confirm</label><input class="f" id="wipeConfirm" placeholder="DELETE" style="max-width:200px">'+
    '<div style="margin-top:14px"><button class="btn" id="wipeBtn" style="background:var(--red);border-color:var(--red)" onclick="commitWipe()">Wipe now</button></div></div>';
}
function commitWipe(){
  var scope=$('wipeScope').value, conf=$('wipeConfirm').value;
  if(conf!=='DELETE'){toast('Type DELETE to confirm');return;}
  $('wipeBtn').disabled=true;$('wipeBtn').textContent='Wiping...';
  run('api_wipeSheets',[scope,conf],function(res){
    toast('Wiped '+res.cleared+' rows from '+res.sheets+' sheets');
    MANAGE_SUB='machines';loadManage();
  });
}

/* ================= LIVE SYNC (sheet -> webapp) =================
 * A standalone page can't be pushed to from Google Sheets, so we POLL: every SYNC_MS we silently
 * re-run the current view. Webapp -> sheet is already instant (every action writes to the sheet).
 * onEdit on the sheet already auto-rebuilds For PC, so both sides stay in step. */
var SYNC_MS=20000, _syncTimer=null;
function refreshCurrent(){
  if($('modalBg')&&$('modalBg').classList.contains('show')) return; // don't disturb an open form
  _silent=true;
  var tok=_viewToken;   // if the user switches tab before this returns, the render is dropped
  try{
    if(CURRENT==='dashboard')loadDashboard(tok);
    else if(CURRENT==='today')loadToday(tok);
    else if(CURRENT==='done')loadDone(tok);
    else if(CURRENT==='assets')loadAssets(tok);
    else if(CURRENT==='issues')loadIssues(tok);
    else if(CURRENT==='bills')loadBills(tok);
    else if(CURRENT==='reports')loadReports(tok);
    else if(CURRENT==='manage')loadManage(tok);
  }catch(e){}
  setTimeout(function(){_silent=false;},50);
}
function startSync(){ stopSync(); _syncTimer=setInterval(refreshCurrent,SYNC_MS); }
function stopSync(){ if(_syncTimer){clearInterval(_syncTimer);_syncTimer=null;} }
function toggleSync(){
  var on=$('autoSync')&&$('autoSync').checked;
  $('syncDot').classList.toggle('on',on);
  if(on)startSync(); else stopSync();
}
function manualRefresh(){ var b=$('refreshBtn'); if(b){b.style.transform='rotate(360deg)';b.style.transition='transform .5s';setTimeout(function(){b.style.transform='';},500);} refreshCurrent(); toast('Synced from sheet'); }

/* ---------------- REPORTS ---------------- */
function loadReports(tok){
  run('api_report',[''],function(d){
    var t=(d&&d.totals)||{}, doers=(d&&d.doers)||[];
    var h='<div class="section"><h2>Overall</h2><div class="cards">'+
      '<div class="card"><div class="k">Total tasks</div><div class="v">'+(t.total||0)+'</div></div>'+
      '<div class="card ok"><div class="k">Done</div><div class="v">'+(t.done||0)+'</div></div>'+
      '<div class="card warn"><div class="k">Pending</div><div class="v">'+(t.pending||0)+'</div></div>'+
      '<div class="card bad"><div class="k">Missed (overdue)</div><div class="v">'+(t.overdue||0)+'</div></div>'+
      '<div class="card"><div class="k">Deleted</div><div class="v">'+(t.deleted||0)+'</div></div>'+
      '</div></div>';
    h+='<div class="section"><h2>Doer performance ('+doers.length+')</h2>';
    if(!doers.length){h+='<div class="empty">No data yet.</div>';}
    else{
      h+='<table><tr><th>Doer</th><th>Done</th><th>Pending</th><th>Missed</th><th>Deleted</th><th>Total</th><th>Completion</th></tr>';
      doers.forEach(function(r){
        var pill=r.completion>=80?'green':(r.completion>=50?'amber':'red');
        h+='<tr><td>'+esc(r.doer)+'</td><td>'+r.done+'</td><td>'+r.pending+'</td>'+
          '<td>'+(r.overdue?('<span class="pill red">'+r.overdue+'</span>'):'0')+'</td>'+
          '<td>'+r.deleted+'</td><td>'+r.total+'</td>'+
          '<td><span class="pill '+pill+'">'+r.completion+'%</span></td></tr>';
      });
      h+='</table>';
    }
    h+='</div>';
    setView(h,tok);
  });
}

/* ---------------- BOOT ---------------- */
run('api_lookups',[],function(l){LOOKUPS=l;go('dashboard');startSync();});
